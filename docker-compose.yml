version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: securevault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: document_management
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: vaultuser
      MYSQL_PASSWORD: vaultpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - securevault-network

  # Spring Boot REST API Backend
  backend:
    build:
      context: ./springapp
      dockerfile: Dockerfile
    container_name: securevault-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/document_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: vaultuser
      DB_PASSWORD: vaultpassword
      JWT_SECRET: nY1mDkHg2JX3aXK0xkj93i9m1p7CqJUt8V2lDmj3Lk9B+oVyR3cJ5z4E3t3UOa0x
      JWT_EXPIRATION: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:80
      ADMIN_NAME: Admin User
      ADMIN_EMAIL: admin@securevault.com
      ADMIN_PASSWORD: Admin@12345
      UPLOAD_DIR: storage/documents
      QR_DIR: storage/qr
      FRONTEND_BASE_URL: http://localhost:3000
      OCR_ENABLED: "true"
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 15
    volumes:
      - doc_storage:/app/storage/documents
      - qr_storage:/app/storage/qr
    networks:
      - securevault-network

  # React Single Page Application Frontend
  frontend:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    container_name: securevault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - securevault-network

volumes:
  mysql_data:
  doc_storage:
  qr_storage:

networks:
  securevault-network:
    driver: bridge
