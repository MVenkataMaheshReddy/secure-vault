# ====================================================================
# SecureVault - Production Hardening Profile (application-prod.properties)
# Active profile: spring.profiles.active=prod
# ====================================================================

# Hibernate & JPA Production Hardening (Strict validation only - no auto-ddl)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Database Configuration (Mandatory environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Production Sizing (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Error Handling Hardening: Never leak stack traces or exception internals to clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Reverse Proxy & Forwarded Headers (Nginx / Cloud Load Balancer)
server.forward-headers-strategy=framework

# Disable Swagger UI / OpenAPI docs in Production
enable.swagger.plugin=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Multipart Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Storage & Upload Limits
securevault.storage.upload-dir=${UPLOAD_DIR:/var/securevault/storage/documents}
securevault.upload.max-doc-size=${MAX_DOC_SIZE:10485760}
securevault.upload.max-image-size=${MAX_IMAGE_SIZE:5242880}

# JWT Production Secrets (Must be supplied via environment variable, >= 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Strict CORS: Whitelist only verified production frontend domain
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://securevault.yourdomain.com}

# Initial Admin Seeding
app.admin.name=${ADMIN_NAME:Admin User}
app.admin.email=${ADMIN_EMAIL:admin@securevault.com}
app.admin.password=${ADMIN_PASSWORD}

# OCR & Verification
securevault.ocr.tessdata-path=${TESSDATA_PREFIX:/usr/share/tessdata}
securevault.ocr.language=${OCR_LANGUAGE:eng}
securevault.ocr.enabled=${OCR_ENABLED:true}
securevault.frontend.base-url=${FRONTEND_BASE_URL:https://securevault.yourdomain.com}
securevault.qr.storage-dir=${QR_DIR:/var/securevault/storage/qr}
securevault.verify.rate-limit-per-min=${VERIFY_RATE_LIMIT_PER_MIN:30}

# Brute-force throttling
securevault.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
securevault.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# Production Logging Levels (Auditing & Anomalies only)
logging.level.root=WARN
logging.level.com.securevault=INFO
logging.level.org.springframework.security=WARN

# ----------------- HTTPS / TLS Readiness Guide -----------------
# Option A (Recommended): Terminate TLS at Reverse Proxy (Nginx / AWS ALB / Cloudflare)
