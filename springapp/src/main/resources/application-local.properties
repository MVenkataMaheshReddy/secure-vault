# ====================================================================
# SecureVault - Local Persistent Database Profile (application-local.properties)
# Runs out-of-the-box using embedded persistent H2 in MySQL compatibility mode.
# No MySQL installation or password configuration required.
# ====================================================================

# Persistent File Database in MySQL mode
spring.datasource.url=jdbc:h2:file:./data/securevault_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger / OpenAPI
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Storage & Upload Limits
securevault.storage.upload-dir=storage/documents
securevault.qr.storage-dir=storage/qr
securevault.ocr.tessdata-path=storage/tessdata
securevault.ocr.enabled=true
securevault.upload.max-doc-size=10485760
securevault.upload.max-image-size=5242880

# JWT & Security
jwt.secret=nY1mDkHg2JX3aXK0xkj93i9m1p7CqJUt8V2lDmj3Lk9B+oVyR3cJ5z4E3t3UOa0x
jwt.expiration=3600000
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Default Admin Seeding
app.admin.name=Admin User
app.admin.email=admin@securevault.com
app.admin.password=Admin@12345
securevault.frontend.base-url=http://localhost:3000
securevault.verify.rate-limit-per-min=30
