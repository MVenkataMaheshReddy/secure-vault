# ====================================================================
# SecureVault - Development Profile (application-dev.properties)
# Active profile: spring.profiles.active=dev
# ====================================================================

# Hibernate & JPA Development Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Database Configuration with Local Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ashokm@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# OpenAPI / Swagger enabled in development
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Multipart Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Storage & Upload Limits
securevault.storage.upload-dir=${UPLOAD_DIR:storage/documents}
securevault.upload.max-doc-size=${MAX_DOC_SIZE:10485760}
securevault.upload.max-image-size=${MAX_IMAGE_SIZE:5242880}

# JWT Settings (Development key >= 256 bits)
jwt.secret=${JWT_SECRET:nY1mDkHg2JX3aXK0xkj93i9m1p7CqJUt8V2lDmj3Lk9B+oVyR3cJ5z4E3t3UOa0x}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Initial Admin Seeding
app.admin.name=${ADMIN_NAME:Admin User}
app.admin.email=${ADMIN_EMAIL:admin@securevault.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# OCR & Verification
securevault.ocr.tessdata-path=${TESSDATA_PREFIX:storage/tessdata}
securevault.ocr.language=${OCR_LANGUAGE:eng}
securevault.ocr.enabled=${OCR_ENABLED:true}
securevault.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
securevault.qr.storage-dir=${QR_DIR:storage/qr}
securevault.verify.rate-limit-per-min=${VERIFY_RATE_LIMIT_PER_MIN:30}

# Brute-force throttling
securevault.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
securevault.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# Logging
logging.level.com.securevault=DEBUG
logging.level.org.springframework.security=INFO
