# Test profile configuration with H2 in MySQL mode
spring.datasource.url=jdbc:h2:mem:securevault_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=20000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Test storage directories
securevault.storage.upload-dir=target/test-storage/documents
securevault.qr.storage-dir=target/test-storage/qr
securevault.ocr.tessdata-path=storage/tessdata
securevault.ocr.enabled=false

# JWT configuration
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=3600000

# Seeding
app.admin.name=Admin User
app.admin.email=admin@securevault.com
app.admin.password=Admin@12345
app.admin.registration-code=ADMIN_SECRET_2025
securevault.verify.rate-limit-per-min=100
